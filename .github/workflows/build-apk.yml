name: Build Android APK
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Force Build Without GitHub Cache
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          gradle assembleDebug --no-build-cache --stacktrace
        working-directory: PremiumLauncher

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neos-Launcher-v1.0
          path: PremiumLauncher/app/build/outputs/apk/debug/app-debug.apk
          
