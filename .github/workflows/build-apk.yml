name: Build Android APK
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Without Network Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true
          cache-read-only: false
          cache-overwrite-existing: false

      - name: Build Android App Bundle / APK
        run: gradle assembleDebug --no-build-cache --stacktrace --warning-mode all
        working-directory: PremiumLauncher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
