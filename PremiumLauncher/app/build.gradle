plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.example.premiumlauncher"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Enable Jetpack Compose
        buildFeatures {
            compose true
        }
        composeOptions {
            kotlinCompilerExtensionVersion compose_version
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {

    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.10.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.activity:activity-compose:1.7.2"
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-to-preview:$compose_version"
    implementation "androidx.compose.material3:material3:$compose_version"
    implementation "androidx.compose.ui:ui-graphics:$compose_version"

    // For window manager (needed for lock screen and launcher)
    implementation "androidx.window:window:1.0.0"
    implementation "androidx.window:window-java:1.0.0"

    // For services and receivers
    implementation "androidx.legacy:legacy-support-v4:1.0.0"

    // For Coroutines (used in background tasks)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // For Lottie animations (optional, but we might use for some effects)
    implementation "com.airbnb.android:lottie:6.4.0"

    // For Glide (to load images, though we are vectorizing icons)
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    // For Room database (to store settings, icon cache, etc.)
    implementation "androidx.room:room-runtime:2.5.2"
    kapt "androidx.room:room-compiler:2.5.2"
    implementation "androidx.room:room-ktx:2.5.2"

    // For DataStore (preferences)
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // For WorkManager (background tasks)
    implementation "androidx.work:work-runtime-ktx:2.8.1"

    // Accompanist for Pager
    implementation "com.google.accompanist:pager:0.36.0"
    implementation "com.google.accompanist:pager-indicators:0.36.0"

    // For testing (optional)
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"
}
